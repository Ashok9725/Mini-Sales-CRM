<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customer List - Mini Sales CRM</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <header class="navbar navbar-dark bg-primary p-3">
    <div class="container-fluid">
      <h2 class="text-white m-0">Mini Sales CRM</h2>
      <nav>
        <a href="index.html" class="nav-link d-inline text-white">Home</a>
        <a href="customer_list.html" class="nav-link d-inline text-white">Customer List</a>
        <a href="add_customer.html" class="nav-link d-inline text-white">Add Customer</a>
        <a href="sales_overview.html" class="nav-link d-inline text-white">Sales Overview</a>
      </nav>
    </div>
  </header>

  <main class="container mt-4">
    <h3>Customer List</h3>
    <table class="table table-bordered table-hover mt-3">
      <thead class="table-primary">
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="leadTableBody"></tbody>
    </table>
  </main>

  <!-- Edit Modal -->
  <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title">Edit Lead</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="editLeadForm">
            <input type="hidden" id="editId" />
            <div class="mb-3">
              <label for="editName" class="form-label">Name</label>
              <input type="text" id="editName" class="form-control" required />
            </div>
            <div class="mb-3">
              <label for="editEmail" class="form-label">Email</label>
              <input type="email" id="editEmail" class="form-control" required />
            </div>
            <div class="mb-3">
              <label for="editPhone" class="form-label">Phone</label>
              <input type="tel" id="editPhone" class="form-control" required />
            </div>
            <div class="mb-3">
              <label for="editStatus" class="form-label">Status</label>
              <select id="editStatus" class="form-select">
                <option>Interested</option>
                <option>Sold</option>
                <option>Not Sold</option>
              </select>
            </div>
            <button type="submit" class="btn btn-primary">Update Lead</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/customerList.js"></script>
</body>
</html>
