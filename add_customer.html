<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Customer - Mini Sales CRM</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <header class="navbar navbar-dark bg-primary p-3">
    <div class="container-fluid">
      <h2 class="text-white m-0">Mini Sales CRM</h2>
      <nav>
        <a href="index.html" class="nav-link d-inline text-white">Home</a>
        <a href="customer_list.html" class="nav-link d-inline text-white">Customer List</a>
        <a href="add_customer.html" class="nav-link d-inline text-white">Add Customer</a>
        <a href="sales_overview.html" class="nav-link d-inline text-white">Sales Overview</a>
      </nav>
    </div>
  </header>

  <main class="container mt-5">
    <h3>Add New Customer</h3>
    <form id="addCustomerForm" class="mt-3">
      <div class="mb-3">
        <label for="name" class="form-label">Name</label>
        <input id="name" class="form-control" required />
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input id="email" type="email" class="form-control" required />
      </div>
      <div class="mb-3">
        <label for="phone" class="form-label">Phone</label>
        <input id="phone" type="tel" class="form-control" required />
      </div>
      <div class="mb-3">
        <label for="status" class="form-label">Status</label>
        <select id="status" class="form-select">
          <option>Interested</option>
          <option>Sold</option>
          <option>Not Sold</option>
        </select>
      </div>
      <button class="btn btn-success">Add Customer</button>
    </form>
  </main>

  <script src="js/addCustomer.js"></script>
</body>
</html>
